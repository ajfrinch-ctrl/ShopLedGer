<!doctype html>
<!--
  ShopLedGer — Mobile UI Design (shell page)
  ----------------------------------------------------------------------------
  এখানে শুধু খোলস। আসল জিনিসপত্র দুই ফাইলে:
    • ui.css → থিম টোকেন (রঙ, radius, shadow, font-size) + সব স্টাইল
    • ui.js  → CONFIG (টেক্সট/ভ্যালু/আইকন/ট্যাব) + রেন্ডার
  নিচের <div id="app">-এর ভেতরটা ui.js অটো ভরে দেয়।
-->
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04795a" />
  <title>ShopLedGer — Mobile UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <div class="app" id="app"></div>
  <script src="ui.js" defer></script>
</body>
</html>
